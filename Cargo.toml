[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "26.11.1-rc.1"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Felix Erckenbrecht <code@eligs.de>"]
repository = "https://github.com/dg1yfe/tapespeed"
homepage = "https://github.com/dg1yfe/tapespeed"

[profile.release]
debug = 1          # symbols for profiling
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
