name: release

# Tag push vMAJOR.MINOR.PATCH[-pre] -> build all targets, publish a GitHub release.
# Manual start (workflow_dispatch) -> build only, artifacts attached to the run, no release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: debuginfo # release downloads without debug info (local builds keep it)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest } # cross-compiled on Apple Silicon (macos-latest)
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 } # glibc 2.35 baseline
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Version check (tag = Cargo.toml)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag $tag, Cargo.toml $ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag does not match Cargo.toml version $ver"; exit 1; }

      - name: Toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p tapespeed --target ${{ matrix.target }}

      - name: Package
        id: pkg
        shell: bash
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="tapespeed-${ver}-${{ matrix.target }}"
          mkdir -p "dist/$name/docs"
          cp "target/${{ matrix.target }}/release/tapespeed" "dist/$name/"
          cp LICENSE NOTICE README.md "dist/$name/"
          cp docs/MANUAL.md docs/USER_GUIDE.md "dist/$name/docs/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' # cross build: no x86_64 runtime check here
        shell: bash
        run: |
          "target/${{ matrix.target }}/release/tapespeed" --version
          "target/${{ matrix.target }}/release/tapespeed" --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.pkg.outputs.file }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false

      - name: Release notes header
        run: cp .github/release-notes.md release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "tapespeed $GITHUB_REF_NAME" \
            --notes-file release-notes.md --generate-notes $pre
