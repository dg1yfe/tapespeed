[package]
name = "ts-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "tapespeed algorithms: reference tracking, speed model, evidence, absolute speed, correction, survey"
publish = false

[dependencies]
indexmap = "=2.14.2"
ts-dsp = { path = "../ts-dsp" }
num-complex = "=0.4.6"
ts-io = { path = "../ts-io" }
thiserror = "=2.0.21"
rayon = "=1.12.0"
realfft = "=3.5.1"
rustfft = "=6.4.1"
rand = { version = "=0.10.3", default-features = false }
rand_pcg = "=0.10.2"
rand_distr = { version = "=0.6.0", default-features = false }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
npyz = "=0.9.1"
serde_json = "=1.0.154"

[[bench]]
name = "m3_micro"
harness = false
