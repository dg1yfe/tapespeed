[package]
name = "tapespeed"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Speed, wow and flutter correction of tape transfers from a recorded reference tone"

[dependencies]
ts-dsp = { path = "../ts-dsp" }
ts-io = { path = "../ts-io" }
ts-core = { path = "../ts-core" }
ts-plot = { path = "../ts-plot" }
clap = { version = "=4.6.7", features = ["derive"] }
indexmap = "=2.14.2"
rayon = "=1.12.0"

[dev-dependencies]
serde_json = "=1.0.154"

[features]
# live-heap counting allocator for the stage profiler (TAPESPEED_PROF=1); benchmarks only
memprof = []
